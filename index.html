<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wynn Nightlife – Schedule</title>
<style>
:root {
  --gold: #C9A84C;
  --dark: #1A1A2E;
  --bg: #f0ede6;
  --card: #ffffff;
  --border: #e0dbd0;
  --text: #1A1A2E;
  --sub: #666;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: env(safe-area-inset-bottom, 20px); }

.header { background: var(--dark); color: #fff; padding: 14px 16px 16px; position: sticky; top: 0; z-index: 100; }
.header-title { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
.header-sub { font-size: 11px; color: var(--gold); margin-top: 2px; transition: color 0.3s; }
.live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #2ecc71; margin-right: 4px; vertical-align: middle; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

.controls { padding: 12px 12px 6px; display: flex; gap: 8px; align-items: center; background: var(--bg); }
.search-wrap { flex: 1; position: relative; }
.search-wrap input { width: 100%; height: 40px; padding: 0 34px 0 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 16px; background: #fff; color: var(--text); outline: none; }
.search-wrap input:focus { border-color: var(--gold); }
.search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 17px; color: #bbb; display: none; cursor: pointer; padding: 4px; }

.filters { display: flex; gap: 6px; padding: 0 12px 10px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.qf { padding: 7px 14px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 12px; font-weight: 700; color: #888; background: #fff; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.qf.active { background: var(--dark); border-color: var(--dark); color: var(--gold); }

.no-res { text-align: center; color: #bbb; font-size: 13px; padding: 30px 16px; }

.sched-wrap { padding: 12px; }
.sched-title { font-size: 12px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 18px; }
.wday { background: var(--card); border-radius: 8px; padding: 6px 4px; text-align: center; border: 1px solid var(--border); }
.wday-name { font-size: 10px; font-weight: 700; color: var(--sub); }
.wday.has-events { border-color: var(--gold); }
.wpill { display: block; font-size: 7px; font-weight: 700; border-radius: 3px; padding: 2px 3px; margin-top: 3px; text-align: center; line-height: 1.2; }
.wpill-xs { background: #1A1A2E; color: var(--gold); }
.wpill-ebc { background: #0a4f3c; color: #7effd4; }
.wpill-ebcn { background: #3d1a5e; color: #d4aaff; }

.date-row { background: var(--card); border-radius: 12px; margin-bottom: 10px; padding: 12px 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.date-row.today { box-shadow: 0 0 0 2px var(--gold); }
.dr-date { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.dr-today { font-size: 10px; color: var(--gold); margin-left: 6px; }
.dr-venues { display: flex; flex-direction: column; gap: 8px; }
.dr-row { display: flex; align-items: center; gap: 10px; }
.dr-flyer { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #eee; }
.dr-info { min-width: 0; flex: 1; }
.dr-badge { display: inline-block; font-size: 9px; font-weight: 700; border-radius: 4px; padding: 2px 6px; margin-bottom: 3px; }
.dr-badge.xs  { background: #1A1A2E; color: var(--gold); }
.dr-badge.ebc { background: #0a4f3c; color: #7effd4; }
.dr-badge.ebcn { background: #3d1a5e; color: #d4aaff; }
.dr-artist { font-size: 13px; color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">Wynn Nightlife</div>
  <div class="header-sub" id="header-sub">Upcoming Schedule</div>
</div>

<div class="controls">
  <div class="search-wrap">
    <input id="search-input" type="search" placeholder="Search artist or date&#8230;" oninput="onSearch(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <span class="search-clear" id="search-clear" onclick="clearSearch()">&#10005;</span>
  </div>
</div>
<div class="filters">
  <button class="qf active" onclick="setFilter('all',this)">All</button>
  <button class="qf" onclick="setFilter('tonight',this)">Tonight</button>
  <button class="qf" onclick="setFilter('weekend',this)">This Weekend</button>
</div>

<div class="sched-wrap" id="sched-wrap"></div>
<div class="no-res" id="sched-nores" style="display:none">No events match</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbz3iSYTll2B-zuCVRUzQwkrCDrfyJ8lqC6ZnEfsnjUZ7zsFmDKmIA4GQ-3FcdKX-dY/exec';

// ── Self-updating version check ──────────────────────────────────────────
// GitHub Pages is served through a CDN with many edge servers; after a
// deploy, some edges still hand out a stale index.html for a while. This
// checks a tiny version.txt (fetched with a cache-busting query string, so
// it can never itself be stale) against the version baked into THIS loaded
// page. If they don't match, this copy is stale — force a real reload.
const APP_VERSION = '2'; // bump this AND version.txt together on every deploy
(async function checkVersion(){
  try{
    const res = await fetch('version.txt?_=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) return;
    const live = (await res.text()).trim();
    if(live && live !== APP_VERSION){
      location.replace(location.pathname + '?v=' + live + '&_=' + Date.now());
    }
  }catch(e){ /* offline or blocked — just keep using what loaded */ }
})();

// ── Fallback data (shown before the live fetch resolves, or if it fails) ──
let xsEvents=[{"date":"Fri Jul 17","artist":"Gryffin","image":""},{"date":"Sat Jul 18","artist":"ODESZA (DJ Set)","image":""},{"date":"Fri Jul 24","artist":"deadmau5","image":""},{"date":"Sat Jul 25","artist":"Diplo with Special Guest Charly Jordan","image":""},{"date":"Fri Jul 31","artist":"Gryffin","image":""}];
let ebcEvents=[{"date":"Fri Jul 17","artist":"Its Murph","image":""},{"date":"Sat Jul 18","artist":"Marshmello","image":""},{"date":"Sun Jul 19","artist":"Summer of Soccer","image":""},{"date":"Fri Jul 24","artist":"Bob Moses (Club Set)","image":""},{"date":"Sat Jul 25","artist":"ODESZA (DJ Set)","image":""},{"date":"Sun Jul 26","artist":"Sullivan King with Special Guest Bella Hue","image":""},{"date":"Fri Jul 31","artist":"AYYBO","image":""}];
let ebcNightEvents=[{"date":"Wed Jul 15","artist":"Two Friends with Special Guest Charly Jordan","image":""},{"date":"Wed Jul 22","artist":"Dillon Francis","image":""},{"date":"Sat Jul 25","artist":"Slander","image":""},{"date":"Wed Jul 29","artist":"HNTR","image":""}];

const MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function parseDate(s){const m=s.match(/(\w{3})\s+(\d+)/);if(!m)return null;const now=new Date();let year=now.getFullYear();const guess=new Date(year,MONTHS[m[1]],parseInt(m[2]));if(guess<today())year++;return new Date(year,MONTHS[m[1]],parseInt(m[2]));}
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function dateKey(d){return d?d.toISOString().slice(0,10):'';}

function buildSchedule(){
  const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const patterns=[{key:'xs',label:'XS',cls:'wpill-xs',days:[5,6]},{key:'ebc',label:'EBC',cls:'wpill-ebc',days:[5,6,0]},{key:'ebcn',label:'EBC Night',cls:'wpill-ebcn',days:[3,6]}];
  let html=`<div class="sched-title">Weekly Pattern</div><div class="week-grid">`;
  DAY.forEach((name,i)=>{
    const vs=patterns.filter(p=>p.days.includes(i));
    html+=`<div class="wday${vs.length?' has-events':''}"><div class="wday-name">${name}</div>`;
    vs.forEach(p=>html+=`<span class="wpill ${p.cls}">${p.label}</span>`);html+='</div>';
  });
  html+='</div>';

  const dateMap={};
  const add=(evts,cls,label)=>evts.forEach(ev=>{const d=parseDate(ev.date);if(!d)return;const k=dateKey(d);if(!dateMap[k])dateMap[k]={d,items:[]};dateMap[k].items.push({cls,label,artist:ev.artist,image:ev.image});});
  add(xsEvents,'xs','XS');add(ebcEvents,'ebc','EBC');add(ebcNightEvents,'ebcn','EBC Night');

  const t=today();
  html+=`<div class="sched-title" style="margin-top:16px">Upcoming Schedule</div>`;
  Object.keys(dateMap).sort().forEach(k=>{
    const{d,items}=dateMap[k];const isToday=dateKey(d)===dateKey(t);
    const label=`${FULL[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`;
    const search=(label+' '+items.map(it=>it.artist).join(' ')).toLowerCase();
    const venueRows=items.map(it=>`<div class="dr-row">${it.image?`<img class="dr-flyer" src="${it.image}" alt="" loading="lazy" onerror="this.remove()">`:'<div class="dr-flyer"></div>'}<div class="dr-info"><span class="dr-badge ${it.cls}">${it.label}</span><div class="dr-artist">${it.artist}</div></div></div>`).join('');
    html+=`<div class="date-row${isToday?' today':''}" data-search="${search}" data-date-obj="${k}"><div class="dr-date">${label}${isToday?'<span class="dr-today">Today</span>':''}</div><div class="dr-venues">${venueRows}</div></div>`;
  });
  document.getElementById('sched-wrap').innerHTML=html;
  applyFilters();
}

let curFilter='all',curSearch='';
function onSearch(val){curSearch=val.trim().toLowerCase();document.getElementById('search-clear').style.display=val?'block':'none';applyFilters();}
function clearSearch(){document.getElementById('search-input').value='';onSearch('');}
function setFilter(f,btn){curFilter=f;document.querySelectorAll('.qf').forEach(b=>b.classList.remove('active'));btn.classList.add('active');applyFilters();}
function applyFilters(){
  const t=today();const wknd=new Set();
  for(let i=0;i<7;i++){const d=new Date(t);d.setDate(t.getDate()+i);if([0,5,6].includes(d.getDay()))wknd.add(dateKey(d));}
  let vis=0;
  document.querySelectorAll('.date-row').forEach(row=>{
    let show=!curSearch||row.dataset.search.includes(curSearch);
    if(show&&curFilter==='tonight')show=row.dataset.dateObj===dateKey(t);
    if(show&&curFilter==='weekend')show=wknd.has(row.dataset.dateObj);
    row.style.display=show?'':'none';if(show)vis++;
  });
  document.getElementById('sched-nores').style.display=vis?'none':'block';
}

async function loadLiveData(){
  const sub=document.getElementById('header-sub');
  sub.innerHTML='<span class="live-dot" style="background:#f39c12"></span>Fetching schedule…';
  try{
    const res=await fetch(SCRIPT_URL,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||typeof data!=='object')throw new Error('bad data');
    let updated=false;
    if(data.xs&&data.xs.length){xsEvents=data.xs;updated=true;}
    if(data.ebc&&data.ebc.length){ebcEvents=data.ebc;updated=true;}
    if(data.ebcn&&data.ebcn.length){ebcNightEvents=data.ebcn;updated=true;}
    if(!updated)throw new Error('empty');
    buildSchedule();
    sub.innerHTML='<span class="live-dot"></span>Live schedule loaded';
    setTimeout(()=>sub.textContent='Upcoming Schedule',4000);
  }catch(e){
    sub.innerHTML='<span style="color:#e74c3c">⚠ Cached schedule — may not match site</span>';
  }
}

buildSchedule();
loadLiveData();
</script>
</body>
</html>
