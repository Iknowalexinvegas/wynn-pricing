<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wynn Nightlife – Live Table Pricing</title>
<style>
:root {
  --gold: #C9A84C;
  --dark: #1A1A2E;
  --bg: #f0ede6;
  --card: #ffffff;
  --border: #e0dbd0;
  --text: #1A1A2E;
  --sub: #666;
  --avail: #2ecc71;
  --sold: #d05050;
  --inq: #C9A84C;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: env(safe-area-inset-bottom, 20px); }

.header { background: var(--dark); color: #fff; padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; gap: 10px; }
.header-title { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
.header-sub { font-size: 11px; color: var(--gold); margin-top: 1px; }
.refresh-btn { background: var(--gold); color: var(--dark); border: none; border-radius: 8px; font-size: 12px; font-weight: 800; padding: 9px 14px; cursor: pointer; flex-shrink: 0; }
.refresh-btn:disabled { opacity: 0.5; }

.venue-bar { display: flex; background: var(--dark); padding: 0 12px 12px; gap: 8px; }
.venue-btn { flex: 1; padding: 9px 4px; border: 1.5px solid #444; border-radius: 8px; font-size: 11px; font-weight: 700; color: #aaa; background: transparent; cursor: pointer; text-align: center; line-height: 1.3; }
.venue-btn.active { background: var(--gold); border-color: var(--gold); color: var(--dark); }

.controls { padding: 10px 12px 6px; display: flex; gap: 8px; align-items: center; }
.search-wrap { flex: 1; position: relative; }
.search-wrap input { width: 100%; height: 40px; padding: 0 34px 0 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 16px; background: #fff; color: var(--text); outline: none; }
.search-wrap input:focus { border-color: var(--gold); }

.filters { display: flex; gap: 6px; padding: 0 12px 10px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.qf { padding: 7px 14px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 12px; font-weight: 700; color: #888; background: #fff; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.qf.active { background: var(--dark); border-color: var(--dark); color: var(--gold); }

.event-list { padding: 0 12px 20px; }
.event-card { background: var(--card); border-radius: 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); overflow: hidden; }
.event-card.next-card { box-shadow: 0 0 0 2px var(--gold), 0 2px 10px rgba(201,168,76,0.25); }
.event-hd { display: flex; align-items: center; padding: 13px 14px; cursor: pointer; gap: 10px; background: var(--dark); }
.event-info { flex: 1; min-width: 0; }
.event-artist { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-meta { font-size: 11px; color: var(--gold); margin-top: 2px; }
.next-pill { font-size: 9px; font-weight: 800; background: var(--gold); color: var(--dark); border-radius: 4px; padding: 2px 6px; margin-left: 6px; vertical-align: middle; }
.event-arrow { color: var(--gold); font-size: 18px; transition: transform 0.2s; flex-shrink: 0; }
.event-arrow.open { transform: rotate(180deg); }

.event-body { display: none; }
.event-body.open { display: block; }
.trow { display: flex; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); gap: 8px; }
.trow:last-child { border-bottom: none; }
.trow.sold { opacity: 0.55; }
.trow-name { flex: 1; font-size: 13px; font-weight: 600; min-width: 0; }
.trow-sub { font-size: 10px; font-weight: 400; color: var(--sub); margin-top: 1px; }
.trow-prices { text-align: right; flex-shrink: 0; }
.trow-fab { font-size: 14px; font-weight: 700; }
.trow-deposit { font-size: 10px; color: var(--sub); margin-top: 1px; }
.badge { font-size: 9px; font-weight: 800; border-radius: 4px; padding: 2px 6px; flex-shrink: 0; letter-spacing: 0.3px; }
.badge.avail { background: #e7f9ef; color: #1a9c53; }
.badge.sold { background: #fdecec; color: var(--sold); }
.badge.inq { background: #fff5dc; color: #9a7a1e; }

.state { text-align: center; padding: 60px 24px; color: var(--sub); font-size: 14px; }
.state .big { font-size: 34px; margin-bottom: 12px; }
.state button { margin-top: 14px; background: var(--dark); color: var(--gold); border: none; border-radius: 8px; padding: 10px 20px; font-weight: 700; font-size: 13px; cursor: pointer; }
.spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; margin: 0 auto 14px; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-title">WYNN NIGHTLIFE — LIVE PRICING</div>
    <div class="header-sub" id="updated">Loading…</div>
  </div>
  <button class="refresh-btn" id="refreshBtn" onclick="load()">↻ Refresh</button>
</div>
<div class="venue-bar" id="venueBar"></div>
<div class="controls">
  <div class="search-wrap"><input id="search" type="search" placeholder="Search artist or table…" oninput="render()"></div>
</div>
<div class="filters" id="filters"></div>
<div id="content"><div class="state"><div class="spinner"></div>Fetching live prices…</div></div>

<script>
var DOGET_URL = 'https://script.google.com/macros/s/AKfycbz3iSYTll2B-zuCVRUzQwkrCDrfyJ8lqC6ZnEfsnjUZ7zsFmDKmIA4GQ-3FcdKX-dY/exec';
var VENUES = ['XS Nightclub', 'Encore Beach Club', 'EBC At Night'];
var MTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var FILTERS = [
  { id: 'all',   label: 'All' },
  { id: 'avail', label: 'Available' },
  { id: 'u2k',   label: 'Under $2k' },
  { id: 'o5k',   label: '$5k+' }
];
var rows = [], activeVenue = VENUES[0], activeFilter = 'all';

function money(s) { var n = parseInt(String(s || '').replace(/[$,]/g, ''), 10); return isNaN(n) ? 0 : n; }

function eventDate(dateStr) { // "Thu Jun 26" -> Date (year inferred)
  var p = String(dateStr).trim().split(' ');
  if (p.length < 3) return null;
  var m = MTHS.indexOf(p[1]), d = parseInt(p[2], 10), now = new Date();
  if (m === -1 || isNaN(d)) return null;
  var y = now.getFullYear();
  if (m < now.getMonth() - 3) y++;
  return new Date(y, m, d);
}

function load() {
  var btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  document.getElementById('content').innerHTML = '<div class="state"><div class="spinner"></div>Fetching live prices…</div>';
  fetch(DOGET_URL)
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data) {
      rows = data;
      var latest = '';
      rows.forEach(function(r) { var u = String(r.Last_Updated || ''); if (u > latest) latest = u; });
      document.getElementById('updated').textContent = latest ? 'Data updated ' + latest + ' PT' : 'Live from Google Sheet';
      btn.disabled = false;
      buildVenueBar(); buildFilters(); render();
    })
    .catch(function(err) {
      btn.disabled = false;
      document.getElementById('updated').textContent = 'Connection error';
      document.getElementById('content').innerHTML =
        '<div class="state"><div class="big">⚠️</div>Could not load pricing data.<br>' +
        '<span style="font-size:12px">' + err.message + '</span><br>' +
        '<button onclick="load()">Try Again</button></div>';
    });
}

function buildVenueBar() {
  var bar = document.getElementById('venueBar');
  bar.innerHTML = '';
  VENUES.forEach(function(v) {
    var count = rows.filter(function(r) { return r.Venue === v; }).length;
    var b = document.createElement('button');
    b.className = 'venue-btn' + (v === activeVenue ? ' active' : '');
    b.innerHTML = v.replace('Encore Beach Club', 'EBC').replace('EBC At Night', 'EBC NIGHT').toUpperCase() + '<br>' + count + ' tables';
    b.onclick = function() { activeVenue = v; buildVenueBar(); render(); };
    bar.appendChild(b);
  });
}

function buildFilters() {
  var f = document.getElementById('filters');
  f.innerHTML = '';
  FILTERS.forEach(function(fl) {
    var b = document.createElement('button');
    b.className = 'qf' + (fl.id === activeFilter ? ' active' : '');
    b.textContent = fl.label;
    b.onclick = function() { activeFilter = fl.id; buildFilters(); render(); };
    f.appendChild(b);
  });
}

function passFilter(r) {
  var fab = money(r.FAB_Min);
  if (activeFilter === 'avail') return r.Status === 'Available';
  if (activeFilter === 'u2k') return r.Status === 'Available' && fab > 0 && fab < 2000;
  if (activeFilter === 'o5k') return r.Status === 'Available' && fab >= 5000;
  return true;
}

function render() {
  var q = document.getElementById('search').value.toLowerCase().trim();
  var subset = rows.filter(function(r) {
    if (r.Venue !== activeVenue || !passFilter(r)) return false;
    if (q && String(r.Artist).toLowerCase().indexOf(q) === -1 &&
        String(r.Table).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });

  var byDate = {};
  subset.forEach(function(r) {
    var k = String(r.Date);
    (byDate[k] = byDate[k] || []).push(r);
  });
  var dates = Object.keys(byDate).sort(function(a, b) {
    return (eventDate(a) || 0) - (eventDate(b) || 0);
  });

  var c = document.getElementById('content');
  if (!dates.length) {
    c.innerHTML = '<div class="state"><div class="big">🔍</div>No tables match.</div>';
    return;
  }

  var today = new Date(); today.setHours(0,0,0,0);
  var nextIdx = -1;
  for (var i = 0; i < dates.length; i++) {
    var ed = eventDate(dates[i]);
    if (ed && ed >= today) { nextIdx = i; break; }
  }

  var html = '<div class="event-list">';
  dates.forEach(function(dt, idx) {
    var list = byDate[dt].slice().sort(function(a, b) { return money(b.FAB_Min) - money(a.FAB_Min); });
    var artist = list[0].Artist || 'To Be Announced';
    var isNext = idx === nextIdx;
    var openCls = (isNext || q || dates.length === 1) ? ' open' : '';
    var availCount = list.filter(function(r) { return r.Status === 'Available'; }).length;
    html += '<div class="event-card' + (isNext ? ' next-card' : '') + '">' +
      '<div class="event-hd" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\');this.querySelector(\'.event-arrow\').classList.toggle(\'open\')">' +
        '<div class="event-info"><div class="event-artist">' + esc(artist) + (isNext ? '<span class="next-pill">NEXT</span>' : '') + '</div>' +
        '<div class="event-meta">' + esc(dt) + ' · ' + availCount + ' of ' + list.length + ' available</div></div>' +
        '<div class="event-arrow' + openCls + '">▾</div></div>' +
      '<div class="event-body' + openCls + '">';
    list.forEach(function(r) {
      var fab = money(r.FAB_Min), pay = money(r.Pay_Now);
      var st = r.Status === 'Available' ? '<span class="badge avail">OPEN</span>'
             : r.Status === 'Inquiry' ? '<span class="badge inq">INQUIRY</span>'
             : '<span class="badge sold">SOLD OUT</span>';
      html += '<div class="trow' + (r.Status === 'Sold Out' ? ' sold' : '') + '">' +
        '<div class="trow-name">' + esc(r.Table) +
          (r.Max_Guests ? '<div class="trow-sub">Up to ' + esc(r.Max_Guests) + ' guests</div>' : '') + '</div>' +
        '<div class="trow-prices"><div class="trow-fab">' + (fab > 0 ? '$' + fab.toLocaleString() : '—') + '</div>' +
          (pay > 0 ? '<div class="trow-deposit">$' + pay.toLocaleString() + ' deposit</div>' : '') + '</div>' +
        st + '</div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  c.innerHTML = html;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
